<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circles -->
  <defs>
    <style>
      .forest-green { fill: #2d5016; }
      .light-green { fill: #4a7c2f; }
      .cream { fill: #f5f1e8; }
      .gold { fill: #d4a574; }
      .teal { fill: #1a4d5c; }
      .brown { fill: #3d3d2d; }
    </style>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#2d5016" stroke-width="8"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#d4a574" stroke-width="3"/>
  
  <!-- Africa map shape -->
  <path d="M 200 80 L 240 100 L 250 130 L 240 160 L 260 180 L 250 220 L 270 260 L 240 280 L 200 290 L 160 280 L 130 260 L 120 220 L 110 180 L 130 160 L 120 130 L 130 100 Z" class="forest-green" opacity="0.95"/>
  
  <!-- Central R -->
  <text x="200" y="245" font-size="120" font-weight="bold" font-family="Georgia, serif" text-anchor="middle" class="cream" opacity="0.95">R</text>
  
  <!-- Acacia tree accent -->
  <g transform="translate(215, 215)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#8b6f47" stroke-width="2"/>
    <ellipse cx="0" cy="-8" rx="16" ry="12" class="gold" opacity="0.8"/>
  </g>
  
  <!-- Top Left: Sea Turtle Circle (Teal background) -->
  <circle cx="110" cy="100" r="38" class="teal"/>
  <g transform="translate(110, 100)">
    <ellipse cx="0" cy="0" rx="16" ry="14" class="cream"/>
    <circle cx="0" cy="-14" r="5" class="cream"/>
    <ellipse cx="-10" cy="-2" rx="5" ry="8" class="cream"/>
    <ellipse cx="10" cy="-2" rx="5" ry="8" class="cream"/>
    <path d="M -4 14 Q 0 16 4 14" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Top Center: Dog Circle (Forest Green background) -->
  <circle cx="200" cy="75" r="38" class="forest-green"/>
  <g transform="translate(200, 75)">
    <!-- Tree -->
    <path d="M -6 10 Q -12 4 -6 -4 Q 0 -6 0 -12 Q 0 -6 6 -4 Q 12 4 6 10 Z" class="cream"/>
    <!-- Birds -->
    <g transform="translate(-4, -16)">
      <path d="M 0 0 L 2 -1.5 L 4 0 Z" class="cream" opacity="0.8"/>
    </g>
    <g transform="translate(6, -14)">
      <path d="M 0 0 L 2 -1.5 L 4 0 Z" class="cream" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Top Right: Elephant Circle (Gold background) -->
  <circle cx="290" cy="100" r="38" class="gold"/>
  <g transform="translate(290, 100)">
    <ellipse cx="0" cy="0" rx="14" ry="16" class="cream"/>
    <circle cx="0" cy="-12" r="6" class="cream"/>
    <path d="M 0 -6 Q 4 4 2 12" stroke="#f5f1e8" stroke-width="4" fill="none"/>
    <rect x="-4" y="12" width="2.5" height="8" class="cream"/>
    <rect x="1.5" y="12" width="2.5" height="8" class="cream"/>
    <path d="M -6 24 L -3 20 M 0 24 L 3 20 M 6 24 L 9 20" stroke="#d4a574" stroke-width="1.5"/>
  </g>
  
  <!-- Right: Eagle Circle (Brown background) -->
  <circle cx="310" cy="180" r="38" class="brown"/>
  <g transform="translate(310, 180)">
    <path d="M -15 10 L 0 -8 L 15 10 Z" class="cream" opacity="0.85"/>
    <path d="M -4 -4 L -14 -1 L -6 2 Z" class="cream"/>
    <path d="M 4 -4 L 14 -1 L 6 2 Z" class="cream"/>
    <circle cx="0" cy="-1" r="3" class="cream"/>
  </g>
  
  <!-- Left decorative leaves -->
  <g transform="translate(80, 200)" class="forest-green">
    <ellipse cx="0" cy="-8" rx="3.5" ry="9" opacity="0.9" transform="rotate(-30)"/>
    <ellipse cx="-4" cy="-2" rx="3.5" ry="9" opacity="0.8" transform="rotate(-60)" class="light-green"/>
    <ellipse cx="-2.5" cy="6" rx="3.5" ry="9" opacity="0.9" transform="rotate(20)"/>
    <ellipse cx="0" cy="10" rx="3.5" ry="9" opacity="0.8" class="light-green" transform="rotate(45)"/>
    <ellipse cx="4" cy="6" rx="3.5" ry="9" opacity="0.9" transform="rotate(70)"/>
  </g>
</svg>